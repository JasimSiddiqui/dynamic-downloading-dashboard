<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dynamic Downloading Dashboard</title>
    <script src="theme.js"></script>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <svg width="0" height="0" style="position:absolute" aria-hidden="true">
      <defs>
        <symbol id="i-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/></symbol>
        <symbol id="i-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></symbol>
        <symbol id="i-stream" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="M10 9.5v5l4.5-2.5z" fill="currentColor"/></symbol>
        <symbol id="i-audio" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="17.5" cy="16" r="2.5"/></symbol>
        <symbol id="i-archive" viewBox="0 0 24 24"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/><path d="M3 3h18v4H3z"/><path d="M10 11h4"/></symbol>
        <symbol id="i-document" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/></symbol>
        <symbol id="i-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3"/><circle cx="9" cy="10" r="1.6"/><path d="m21 16-5-5-9 9"/></symbol>
        <symbol id="i-app" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></symbol>
        <symbol id="i-torrent" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3"/><path d="M6 7h4M14 7h4"/></symbol>
        <symbol id="i-ftp" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="2"/><rect x="3" y="13" width="18" height="7" rx="2"/><path d="M7 7.5h.01M7 16.5h.01"/></symbol>
        <symbol id="i-pause" viewBox="0 0 24 24"><path d="M9 6v12M15 6v12"/></symbol>
        <symbol id="i-play" viewBox="0 0 24 24"><path d="M8 5.5v13l10.5-6.5z" fill="currentColor"/></symbol>
        <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5"/></symbol>
        <symbol id="i-retry" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
        <symbol id="i-bang" viewBox="0 0 24 24"><path d="M12 7v6M12 17h.01"/></symbol>
        <symbol id="i-link" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1"/><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1"/></symbol>
        <symbol id="i-folder" viewBox="0 0 24 24"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></symbol>
        <symbol id="i-gear" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></symbol>
        <symbol id="i-arrow" viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6"/></symbol>
        <symbol id="i-up" viewBox="0 0 24 24"><path d="M12 20V6M6 12l6-6 6 6"/></symbol>
        <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
        <symbol id="i-copy" viewBox="0 0 24 24"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></symbol>
        <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-12M9 7V4h6v3"/></symbol>
        <symbol id="i-open" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v4a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4"/></symbol>
        <symbol id="i-headphones" viewBox="0 0 24 24"><path d="M4 15v-3a8 8 0 0 1 16 0v3"/><rect x="3" y="14" width="4.5" height="6.5" rx="1.5"/><rect x="16.5" y="14" width="4.5" height="6.5" rx="1.5"/></symbol>
        <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
        <symbol id="i-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
        <symbol id="i-moon" viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></symbol>
      </defs>
    </svg>

    <header class="bar" data-tauri-drag-region>
      <img class="bar__mark" src="assets/logo.svg" alt="" width="22" height="22" data-tauri-drag-region />
      <div class="bar__mini" id="mini" data-tauri-drag-region></div>
      <div class="bar__tools">
        <button class="tool" id="theme" aria-label="Theme">
          <svg class="ico ico--sun"><use href="#i-sun" /></svg>
          <svg class="ico ico--moon"><use href="#i-moon" /></svg>
        </button>
        <button class="tool" id="folder" aria-label="Downloads folder"><svg class="ico"><use href="#i-folder" /></svg></button>
        <button class="tool" id="gear" aria-label="Settings"><svg class="ico"><use href="#i-gear" /></svg></button>
      </div>
      <div class="bar__win">
        <button class="win" id="w-min" aria-label="Minimize"><svg viewBox="0 0 12 12"><path d="M2 6h8" /></svg></button>
        <button class="win" id="w-max" aria-label="Maximize"><svg viewBox="0 0 12 12"><rect x="2.5" y="2.5" width="7" height="7" rx="1" /></svg></button>
        <button class="win win--close" id="w-close" aria-label="Close"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3 3 9" /></svg></button>
      </div>
    </header>

    <main class="stage is-empty" id="stage">
      <section class="hero" id="hero">
        <div class="speed" id="speed" aria-live="off">
          <div class="speed__read"><span class="speed__num" id="speed-num">0</span><span class="speed__unit" id="speed-unit">MB/s</span></div>
          <svg class="spark" id="spark" viewBox="0 0 300 40" preserveAspectRatio="none">
            <defs>
              <linearGradient id="spark-fill" x1="0" y1="0" x2="0" y2="1">
                <stop offset="0" stop-color="var(--accent)" stop-opacity=".28" />
                <stop offset="1" stop-color="var(--accent)" stop-opacity="0" />
              </linearGradient>
            </defs>
            <path id="spark-area" fill="url(#spark-fill)" stroke="none" />
            <path id="spark-line" fill="none" stroke="var(--accent)" stroke-width="2" vector-effect="non-scaling-stroke" />
          </svg>
        </div>
        <form class="where" id="where" autocomplete="off">
          <svg class="where__ico"><use href="#i-link" /></svg>
          <input id="q" type="text" placeholder="Where from?" spellcheck="false" aria-label="Link" />
          <button class="where__go" id="go" type="submit" aria-label="Download"><svg><use href="#i-arrow" /></svg></button>
          <div class="where__busy"></div>
        </form>
        <p class="note" id="note"></p>
        <button class="chip" id="chip" type="button" hidden>
          <span class="chip__ico"><svg><use href="#i-file" /></svg></span>
          <span class="chip__text"><span class="chip__title"></span><span class="chip__detail"></span></span>
          <svg class="chip__go"><use href="#i-arrow" /></svg>
        </button>
      </section>
      <ul class="list" id="list"></ul>
    </main>

    <div class="drop" id="drop" aria-hidden="true">
      <div class="drop__ring"><svg><use href="#i-arrow" /></svg></div>
    </div>

    <div class="scrim" id="scrim"></div>
    <section class="sheet" id="sheet" role="dialog" aria-modal="true">
      <div class="sheet__grip"></div>
      <div class="sheet__body" id="sheet-body"></div>
    </section>

    <div class="menu" id="menu" role="menu"></div>
    <div class="toast" id="toast"></div>

    <template id="row-tpl">
      <li class="row" tabindex="0">
        <div class="row__fill"></div>
        <button class="row__icon" type="button">
          <svg class="row__kind"><use /></svg>
          <svg class="row__act"><use /></svg>
        </button>
        <div class="row__main">
          <div class="row__name"></div>
          <div class="row__meta"></div>
        </div>
        <div class="row__right">
          <span class="row__speed"></span>
          <span class="row__eta"></span>
        </div>
        <button class="row__folder" type="button" aria-label="Show in folder"><svg><use href="#i-folder" /></svg></button>
        <div class="row__line"></div>
        <div class="row__more">
          <div class="lanes"></div>
          <div class="row__src"></div>
          <div class="row__acts">
            <button class="act" data-act="open"><svg><use href="#i-open" /></svg></button>
            <button class="act" data-act="reveal"><svg><use href="#i-folder" /></svg></button>
            <button class="act" data-act="copy"><svg><use href="#i-copy" /></svg></button>
            <button class="act act--danger" data-act="remove"><svg><use href="#i-trash" /></svg></button>
          </div>
        </div>
      </li>
    </template>

    <script src="main.js"></script>
  </body>
</html>
