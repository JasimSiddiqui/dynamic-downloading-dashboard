<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>DDD</title>
    <script src="theme.js"></script>
    <style>
      @font-face {
        font-family: "Inter";
        src: url("fonts/InterVariable.woff2") format("woff2");
        font-weight: 100 900;
      }
      :root {
        --cap: #000;
        --cap-ink: #fff;
        --cap-ink-2: rgba(255, 255, 255, 0.62);
        --accent: #7c3aed;
        --ease: cubic-bezier(0.22, 1, 0.36, 1);
      }
      :root[data-theme="dark"] {
        --cap: #fff;
        --cap-ink: #000;
        --cap-ink-2: rgba(0, 0, 0, 0.55);
        --accent: #8b5cf6;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        background: transparent;
        overflow: hidden;
        font: 400 14px/1.35 "Inter", "Segoe UI", system-ui, sans-serif;
        letter-spacing: -0.006em;
        font-optical-sizing: auto;
        -webkit-font-smoothing: antialiased;
        user-select: none;
      }
      .cap {
        position: absolute;
        inset: 6px;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 0 10px 0 10px;
        border-radius: 22px;
        background: var(--cap);
        color: var(--cap-ink);
        cursor: pointer;
        transform: translateY(120%);
        opacity: 0;
        transition: transform 0.5s var(--ease), opacity 0.3s;
      }
      .cap.is-on {
        transform: none;
        opacity: 1;
      }
      .cap:active {
        transform: scale(0.98);
      }
      .ico {
        width: 44px;
        height: 44px;
        border-radius: 15px;
        display: grid;
        place-items: center;
        background: var(--accent);
        color: #fff;
        flex: none;
        transition: transform 0.3s var(--ease);
      }
      svg {
        width: 22px;
        height: 22px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .text {
        flex: 1;
        min-width: 0;
      }
      .title {
        font-weight: 600;
        letter-spacing: -0.012em;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .detail {
        margin-top: 1px;
        font-size: 13px;
        letter-spacing: 0;
        color: var(--cap-ink-2);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .go {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        color: var(--accent);
        flex: none;
      }
      .timer {
        position: absolute;
        left: 22px;
        right: 22px;
        bottom: 6px;
        height: 2px;
        border-radius: 2px;
        background: var(--accent);
        transform-origin: left;
        opacity: 0.7;
      }
      .cap.run .timer {
        animation: drain 6s linear forwards;
      }
      .cap:hover .timer {
        animation-play-state: paused;
      }
      .cap.taken .ico {
        transform: scale(1.08);
      }
      .cap.taken .timer {
        display: none;
      }
      @keyframes drain {
        to {
          transform: scaleX(0);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .cap {
          transition-duration: 0.01ms;
        }
      }
    </style>
  </head>
  <body>
    <div class="cap" id="cap">
      <div class="ico"><svg><use id="glyph" href="#g-file" /></svg></div>
      <div class="text">
        <div class="title" id="title"></div>
        <div class="detail" id="detail"></div>
      </div>
      <div class="go"><svg><use id="go" href="#g-arrow" /></svg></div>
      <div class="timer" id="timer"></div>
    </div>
    <svg width="0" height="0" style="position:absolute">
      <defs>
        <symbol id="g-file" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5" /></symbol>
        <symbol id="g-video" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="3" /><path d="M10 9.5v5l4.5-2.5z" fill="currentColor" /></symbol>
        <symbol id="g-audio" viewBox="0 0 24 24"><path d="M9 18V6l11-2v12" /><circle cx="6.5" cy="18" r="2.5" /><circle cx="17.5" cy="16" r="2.5" /></symbol>
        <symbol id="g-archive" viewBox="0 0 24 24"><path d="M4 7h16v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z" /><path d="M3 3h18v4H3z" /><path d="M10 11h4" /></symbol>
        <symbol id="g-document" viewBox="0 0 24 24"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" /><path d="M14 3v5h5M9 13h6M9 17h4" /></symbol>
        <symbol id="g-image" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="3" /><circle cx="9" cy="10" r="1.6" /><path d="m21 16-5-5-9 9" /></symbol>
        <symbol id="g-app" viewBox="0 0 24 24"><rect x="3" y="3" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="3" width="7.5" height="7.5" rx="2" /><rect x="3" y="13.5" width="7.5" height="7.5" rx="2" /><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2" /></symbol>
        <symbol id="g-torrent" viewBox="0 0 24 24"><path d="M6 3v8a6 6 0 0 0 12 0V3" /><path d="M6 7h4M14 7h4" /></symbol>
        <symbol id="g-many" viewBox="0 0 24 24"><path d="M10 14a5 5 0 0 0 7 0l3-3a5 5 0 0 0-7-7l-1 1" /><path d="M14 10a5 5 0 0 0-7 0l-3 3a5 5 0 0 0 7 7l1-1" /></symbol>
        <symbol id="g-arrow" viewBox="0 0 24 24"><path d="M12 4v14M6 12l6 6 6-6" /></symbol>
        <symbol id="g-check" viewBox="0 0 24 24"><path d="m5 12.5 4.5 4.5L19 7.5" /></symbol>
      </defs>
    </svg>
    <script src="catch.js"></script>
  </body>
</html>
